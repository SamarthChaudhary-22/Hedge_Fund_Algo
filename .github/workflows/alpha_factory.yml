name: Alpha Factory (Daily Regression Matrix)

on:
  # Run once a day at 8:00 AM UTC (3:00 AM EST)
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: # Manual run button

jobs:
  generate_alphas:
    name: 🏭 Data Downloader & Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30 # This shouldn't take more than 5-10 mins
    
    # We need permission to write the JSON file back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements2.txt

      - name: Run Data Downloader (Generates JSON)
        run: python data_download.py

      - name: Commit and Push factor_weights.json
        run: |
          # Configure the GitHub bot user
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if the JSON file actually changed to avoid empty commits
          git add factor_weights.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update Alpha Matrix (factor_weights.json)"
          
          # Push the updated file back to the main branch
          git push origin main
